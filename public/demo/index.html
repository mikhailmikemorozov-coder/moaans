<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BI Color Мастерская</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: tablet-first workshop app — left nav rail + scrolling work area; on phones the rail becomes a bottom bar. Dark-first like the bi-color.ru site. */
:root{
  --bg:#121315; --panel:#1b1d21; --panel2:#24272c; --line:#30343b;
  --fg:#eeece8; --muted:#9b9ea6; --accent:#ff6b00; --accent-ink:#1c0c00; --accent-soft:rgba(255,107,0,.14);
  --s-new:#5aaeff; --s-work:#ff8a2a; --s-wait:#f2c14b; --s-ready:#43d18f; --s-done:#7c8089; --bad:#ff5b5f;
  --tire:#2a2c31; --rim:#8d939c; --rim2:#5d636c;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f2; --panel:#ffffff; --panel2:#f4f5f7; --line:#dadde2;
  --fg:#17191c; --muted:#646972; --accent:#e85f00; --accent-ink:#ffffff; --accent-soft:rgba(232,95,0,.11);
  --s-new:#1f7fe0; --s-work:#e06a00; --s-wait:#b98a00; --s-ready:#13955a; --s-done:#80858e; --bad:#d63a3f;
  --tire:#3a3d43; --rim:#c3c8cf; --rim2:#949aa3; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef0f2; --panel:#ffffff; --panel2:#f4f5f7; --line:#dadde2;
  --fg:#17191c; --muted:#646972; --accent:#e85f00; --accent-ink:#ffffff; --accent-soft:rgba(232,95,0,.11);
  --s-new:#1f7fe0; --s-work:#e06a00; --s-wait:#b98a00; --s-ready:#13955a; --s-done:#80858e; --bad:#d63a3f;
  --tire:#3a3d43; --rim:#c3c8cf; --rim2:#949aa3; color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:96px 1fr;height:100%}
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:16px;padding-left:env(safe-area-inset-left,0px)}
.logo{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.02em;margin-bottom:14px;text-align:center;line-height:1.1}
.logo b{color:var(--accent)}
.nav button{width:78px;padding:10px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted);background:none;border:0}
.nav button svg{width:24px;height:24px}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button.plus{background:var(--accent);color:var(--accent-ink)}
.nav button.plus.on{outline:2px solid var(--fg);outline-offset:2px}
main{overflow-y:auto;padding-block:22px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh h1{font-family:var(--f-disp);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--f-disp);font-weight:600;font-size:24px;margin-top:6px}
.stat .v.acc{color:var(--accent)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec h2 .cnt{background:var(--panel2);border-radius:999px;padding:1px 8px;color:var(--fg)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);padding:14px 16px;border:1px dashed var(--line);border-radius:14px}

.oc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.oc:hover{border-color:var(--rim2);border-left-color:var(--st)}
.oc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.oc .nm{font-weight:600;font-size:16px}
.oc .no{color:var(--muted);font-size:13px}
.oc .what{color:var(--muted);font-size:14px}
.oc .bot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.oc .sum{font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--fg);white-space:nowrap}
.tag.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.tag.today{background:var(--accent-soft);color:var(--accent)}
.tag.st{background:color-mix(in srgb,var(--st) 18%,transparent);color:var(--st)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{--st:var(--s-new)}.s-work{--st:var(--s-work)}.s-wait{--st:var(--s-wait)}.s-ready{--st:var(--s-ready)}.s-done{--st:var(--s-done)}

.visit{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.visit .t{font-family:var(--f-disp);font-weight:600;font-size:16px;min-width:56px}
.visit .i{flex:1;min-width:0}
.visit .i div:last-child{color:var(--muted);font-size:14px}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--s-ready);border-color:var(--s-ready);color:#04130b}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.ghost{background:none}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.colm{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.colm h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.colm h3 span:first-child{display:flex;align-items:center;gap:8px;color:var(--st)}
.next{align-self:flex-start}

/* intake */
.intake{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.intake{grid-template-columns:minmax(0,1fr)}}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.blk h2{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.blk h2 small{font-weight:500;color:var(--muted);font-size:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}
.fld input.err{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.lbl{font-size:12px;color:var(--muted);margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.75;font-weight:500;margin-left:4px}
.hint{margin:0;color:var(--muted);font-size:13px}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--accent-soft);border:1px solid transparent;border-radius:12px;padding:10px 12px}
.sugg button span:last-child{color:var(--muted);font-size:13px}
.cinfo{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.note{color:var(--s-wait);font-weight:500}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 10px}
.ln .n{font-weight:500;min-width:0}
.ln .n small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.stp{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.stp button{border:0;background:none;width:30px;height:30px;font-size:18px}
.stp span{min-width:18px;text-align:center}
.ln input{width:84px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:right}
.ln .s{min-width:82px;text-align:right;font-weight:700}
@media (max-width:520px){.ln{grid-template-columns:minmax(0,1fr) auto}.ln .s{grid-column:2}}
.tog{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 12px;background:var(--panel2);border-radius:12px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.wheels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.wheels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wt{position:relative;aspect-ratio:1;max-width:100%;border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden;padding:0}
.wt img,.wt svg{width:100%;height:100%;object-fit:cover;display:block}
.wt .wl{position:absolute;left:6px;top:6px;background:var(--bg);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:700}
.wt .wd{position:absolute;right:6px;bottom:6px;background:var(--bad);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
.wt .wd.none{background:var(--bg);color:var(--muted)}
.bar{position:sticky;bottom:0;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.bar-l{font-size:12px;color:var(--muted)}
.bar-t{font-family:var(--f-disp);font-weight:600;font-size:24px}
.timer{font-family:var(--f-disp);font-weight:600;font-size:15px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
.timer.run{color:var(--accent);border-color:var(--accent)}

/* sheet */
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:31;overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-top h2{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:800}
.x{border:0;background:var(--panel2);border-radius:12px;width:40px;height:40px;font-size:20px;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.phone{font-family:var(--f-disp);font-weight:600;font-size:18px;user-select:all}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{flex:1 1 auto;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.steps button.on{background:color-mix(in srgb,var(--st) 20%,transparent);border-color:var(--st);color:var(--st)}
.steps button.past{color:var(--fg)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;white-space:nowrap;font-weight:600}
table.t tr.extra td:first-child::before{content:"доплата";font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-right:6px}
table.t .by{display:block;color:var(--muted);font-size:12px}
.tot{display:flex;flex-direction:column;gap:4px;font-size:15px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-family:var(--f-disp);font-size:20px;font-weight:600}
.tot .left{color:var(--accent)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px}
.log span:first-child{color:var(--muted)}
.msg{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.ph{background:var(--panel2);border-radius:12px;overflow:hidden;font-size:12px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph div{padding:6px 8px;color:var(--muted)}
.addph{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:600;cursor:pointer;text-align:center;padding:6px}
.addph input{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* defects modal */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:100%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mtop h3{margin:0;font-size:18px}
.stage{position:relative;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--panel2);cursor:crosshair;touch-action:manipulation}
.stage img,.stage svg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--bad);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.mk.pend{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.mk.pend{animation:none}}
.dlist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.dlist div{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:10px;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.crow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.crow .m{color:var(--muted);font-size:13px}
.crow .r{text-align:right;flex:none}
.search{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;width:100%;max-width:420px}
.ptable{overflow-x:auto}
.ptable table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;background:var(--panel);border-radius:14px;overflow:hidden}
.ptable th,.ptable td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.demo-note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;gap:2px;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .nav .logo{display:none}
  .nav button{width:auto;flex:1;padding:6px 2px;font-size:11px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .vh h1{font-size:22px}
  .sheet{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .log div{grid-template-columns:minmax(0,1fr)}
}
/* MAX: подписка по QR и переписка бота */
.tag.max{background:color-mix(in srgb,var(--s-new) 18%,transparent);color:var(--s-new)}
.maxq{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.maxq>div{flex:1 1 220px;display:flex;flex-direction:column;gap:8px}
.qr{background:#fff;border-radius:12px;padding:8px;width:128px;height:128px;flex:none;display:grid;place-items:center;color:#111;font-size:11px;text-align:center}
.qr svg{width:100%;height:100%;display:block}
.qr.big{width:min(280px,68vw);height:min(280px,68vw);padding:14px;margin:0 auto}
.chat{background:var(--panel2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.chat .hd{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.chat .hd small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.chat .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 10px var(--f-disp);flex:none}
.bub{align-self:flex-start;max-width:90%;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 4px 14px 14px}
.bub .t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.bub .lnk{color:var(--accent);font-weight:600}
.center{text-align:center}
</style>

const PAINT_LATHE=[5000,5500,6000,6500,7500];

const stName=id=>STATUSES.find(s=>s.id===id).name;

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const ts=(off,h,m)=>{const d=new Date();d.setDate(d.getDate()+off);d.setHours(h,m||0,0,0);return d.getTime()};
const digits=s=>String(s||'').replace(/\D/g,'').slice(-10);
function fmtDay(s){if(s===TODAY)return'сегодня';if(s===dayOff(1))return'завтра';if(s===dayOff(-1))return'вчера';const[,m,d]=s.split('-');return +d+' '+MONTHS[+m-1]}
function fmtPhone(p){const d=digits(p);if(d.length<10)return p;return'+7 ('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6,8)+'-'+d.slice(8,10)}
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const when=t=>fmtDay(iso(new Date(t)))+', '+hm(t);
const wheelLabel=(i,q)=>q===4?POS4[i]:'Диск '+(i+1);

    o.msgs.push({at:o.created,text:botText('new',o,null,C)});o.lines.push(...ex);
    if(['work','ready'].includes(o.status))o.msgs.push({at:o.created+86400000,text:botText('work',o,null,C)});

  return{clients:C,orders:O,seq:1047,visits:[

/* ---------- MAX: тексты бота ---------- */
const BOT='bicolor_bot', ADDR='Внуково, Центральная ул. 18с2';
const maxLink=o=>`https://max.ru/${BOT}?start=z${o.num}`;
function botText(kind,o,x,cl){
  const c=(cl||db.clients).find(k=>k.id===o.clientId);const nm=c.name==='Клиент'?'':c.name.split(' ')[0].replace(/[()]/g,'');const car=o.car&&o.car!=='—'?o.car:'';
  const tot=total(o), lf=left(o), paid=tot-lf;
  switch(kind){
    case 'new':return`${nm?nm+', з':'З'}дравствуйте! Заказ №${o.num} принят.\n${car?car+' · ':''}${o.radius} × ${o.qty}\nСумма: ${rub(tot)}${paid?`, предоплата ${rub(paid)}`:''}\nГотовность: ${+o.due.slice(8)} ${MONTHS[+o.due.slice(5,7)-1]}\nАкт приёмки с фото: bi-color.ru/z/${o.num}`;
    case 'work':return`Заказ №${o.num} взяли в работу. Напишем, как только будет готово.`;
    case 'wait':return`Заказ №${o.num}: ждём материал${o.comment?` (${o.comment})`:''}. Срок может сдвинуться — предупредим.`;
    case 'extra':return`По заказу №${o.num} нашли дополнительную работу: ${x.name}, +${rub(x.unit*x.qty)}.\nНовый итог: ${rub(tot)}. Если есть вопросы — просто ответьте здесь.`;
    case 'ready':return`Готово! Диски ${o.radius}${car?` (${car})`:''} можно забирать.\nК оплате: ${rub(lf)}\nЕжедневно 10:00–19:00, ${ADDR}\nФото «было / стало»: bi-color.ru/z/${o.num}`;
    case 'done':return`Спасибо, что выбрали BI Color! Если что-то будет не так — просто ответьте на это сообщение.`;
    case 'hello':return`Здравствуйте! Это бот мастерской BI Color. Сюда будут приходить статусы заказа №${o.num} и фото.`;
  }
}
const ST_MSG={work:'work',wait:'wait',ready:'ready'};
function notify(o,kind,x){const c=client(o.clientId);if(!c.max)return false;
  const text=botText(kind,o,x);o.msgs=o.msgs||[];o.msgs.push({at:Date.now(),text});logTo(o,'MAX: '+text.split('\n')[0]);return true}
function qrSvg(text){
  try{if(window.qrcode){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}}catch(e){}
  return'QR-код не загрузился — проверьте интернет'}
function chatHtml(o){
  const c=client(o.clientId);const ms=o.msgs||[];
  return`<div class="chat"><div class="hd"><span class="av">BI</span><div>BI Color — мастерская<small>бот в MAX · так видит ${esc(c.name.split(' ')[0])}</small></div></div>
    ${ms.length?ms.map(m=>`<div class="bub${m.me?' me':''}">${esc(m.text).replace(/(bi-color\.ru\/z\/\d+)/g,'<span class="lnk">$1</span>')}<span class="t">${when(m.at)}</span></div>`).join(''):'<p class="hint">По этому заказу бот ещё ничего не отправлял.</p>'}</div>`;
}
function maxCard(o,msg){
  const c=client(o.clientId);
  if(c.max)return`<div class="card"><h3>Клиенту в MAX <span class="tag max" style="text-transform:none;letter-spacing:0;margin-left:4px">подписан</span></h3>
    ${chatHtml(o)}
    ${o.status!=='done'?`<textarea class="msg" id="msg" rows="3">${esc(msg)}</textarea>
    <div class="actions"><button class="btn sm primary" data-act="sendmax">Отправить в MAX</button><button class="btn sm" data-act="copymsg">Скопировать текст</button></div>`:''}
    <p class="hint">Статусы «Принят», «В работе», «Ждём материал», «Готово», доплаты и выдача уходят клиенту сами — кнопку нажимать не нужно.</p></div>`;
  return`<div class="card"><h3>Клиенту в MAX <span class="tag" style="text-transform:none;letter-spacing:0;margin-left:4px">не подписан</span></h3>
    <div class="maxq"><div class="qr">${qrSvg(maxLink(o))}</div><div>
      <b>Пусть клиент наведёт камеру на QR</b><span class="hint">Откроется бот BI Color в MAX. Клиент нажимает «Начать» — бот сам привяжется к заказу №${o.num} и пришлёт акт приёмки. В следующий раз QR не понадобится.</span>
      <div class="actions"><button class="btn sm" data-act="qr" data-v="${o.id}">Показать QR крупно</button><button class="btn sm" data-act="subscribe" data-v="${o.id}">Демо: клиент отсканировал</button></div></div></div>
    ${o.status==='ready'||o.status==='work'?`<div class="lbl">Нет MAX — по старинке</div><textarea class="msg" id="msg" rows="3">${esc(msg)}</textarea>
    <div class="actions"><button class="btn sm" data-act="copymsg">Скопировать текст</button>${o.notified?'<span class="tag" style="color:var(--s-ready)">клиенту сообщили</span>':`<button class="btn sm" data-act="notified">Отметить: позвонил / написал</button>`}</div>`:''}</div>`;
}

const chip=(label,act,v,on,extra='')=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${esc(v)}">${label}${extra}</button>`;
function intakeFill(){

function fillTotal(){const t=total(draft);$('#bar-total').textContent=rub(t);$('#bar-l').textContent=draft.express?'Итого с экспрессом +50%':'Итого'}

  const s=Math.floor((Date.now()-draft.started)/1000);el.textContent=Math.floor(s/60)+':'+pad(s%60);el.classList.add('run')}

function setRadius(r){draft.radius=r;draft.lines.forEach(l=>{if(!l.edited)l.unit=svcById(l.sid).price(r)})}

function acceptDraft(){
  const d=draft;let bad=false;
  if(digits(d.phone).length<10){$('#in-phone').classList.add('err');bad=true}
  if(!d.lines.length){bad=true}
  if(bad){toast(digits(d.phone).length<10?'Введите телефон клиента полностью':'Выберите хотя бы одну работу');return}
  let c=d.clientId?client(d.clientId):db.clients.find(x=>digits(x.phone)===digits(d.phone));
  if(!c){c={id:'c'+Date.now(),name:d.name.trim()||'Клиент',phone:'+7'+digits(d.phone),cars:[],note:''};db.clients.push(c)}
  if(d.car&&!c.cars.includes(d.car))c.cars.unshift(d.car);
  const now=Date.now();
  const o={id:'o'+now,num:db.seq++,clientId:c.id,car:d.car||'—',radius:d.radius,qty:d.qty,type:d.type,color:d.color==='Как было'?'':d.color,express:d.express,kit:[...d.kit],
    defects:d.defects.filter(x=>x.w<d.qty),photos:d.photos,stage:[],status:'new',due:d.due,created:now,comment:d.comment,notified:false,
    lines:d.lines.map(l=>({...l,by:user,at:now})),pays:[],log:[]};
  const pp=+String(d.prepay).replace(/\D/g,'');
  if(pp>0)o.pays.push({amount:pp,method:d.prepayMethod,at:now,by:user});
  o.log.push({at:now,by:user,text:'Принят'+(pp?`, предоплата ${rub(pp)} (${d.prepayMethod.toLowerCase()})`:'')+(o.defects.length?`, отмечено дефектов: ${o.defects.length}`:'')});
  db.orders.push(o);
  const secs=d.started?Math.round((now-d.started)/1000):0;
  db.visits=db.visits.filter(v=>digits(v.phone)!==digits(c.phone));
  const sent=notify(o,'new');
  draft=newDraft();save();view='board';sheet={type:'order',id:o.id};render();
  if(!sent){modal={kind:'qr',id:o.id};renderModal()}
  toast(`Заказ №${o.num} принят${secs?` за ${Math.floor(secs/60)}:${pad(secs%60)}`:''}. Сумма ${rub(total(o))}`+(sent?' · акт ушёл клиенту в MAX':''));
}

  ${st==='ready'?`<div class="card" style="border-color:var(--s-ready)"><h3>Выдача</h3>
    <div class="actions">${['Наличные','Перевод'].map(m=>chip(m,'paym',m,(sheet.pm||'Наличные')===m)).join('')}</div>
    <button class="btn ok big" data-act="issue">Получил ${rub(lf)} и выдал</button></div>`:''}

  ${maxCard(o,msg)}

  <div class="card"><h3>Приёмка: комплектность и дефекты</h3>
    <div class="chips">${o.kit.map(k=>`<span class="tag">${esc(k)}</span>`).join('')||'<span style="color:var(--muted)">не отмечено</span>'}</div>
    <div class="wheels">${wheelTiles(o,'order')}</div></div>

  <div class="card"><h3>Фото по ходу работы</h3>
    <div class="photos">${o.stage.map(p=>`<div class="ph"><img src="${p.src}" alt=""><div>${esc(stName(p.st))} · ${p.by}, ${hm(p.at)}</div></div>`).join('')}
    <label class="addph">+ Фото этапа<input type="file" accept="image/*" capture="environment" data-ph="stage"></label></div>
    ${o.stage.length?'':'<p class="hint">Снимайте этапы: сняли краску, нашли трещину, грунт, готово. Каждое фото подписывается статусом, временем и кто снял.</p>'}</div>

  <div class="card"><h3>История</h3><div class="log">${o.log.slice().reverse().map(l=>`<div><span class="num">${when(l.at)}</span><span><b>${l.by}:</b> ${esc(l.text)}</span></div>`).join('')}</div></div>`;
}
function addxForm(){
  const o=order(sheet.id);
  return`<div class="cinfo"><div class="chips">${SERVICES.map(s=>chip(s.name,'xsvc',s.id,sheet.xs===s.id)).join('')}</div>
  <div class="row2"><label class="fld"><span>Что сделали</span><input id="x-name" value="${esc(sheet.xs?svcById(sheet.xs).name:'')}" placeholder="Например: сварка трещины ПП"></label>
  <label class="fld"><span>Сумма, ₽</span><input id="x-price" inputmode="numeric" value="${sheet.xs?svcById(sheet.xs).price(o.radius):''}"></label></div>
  <div class="actions"><button class="btn sm primary" data-act="xsave">Добавить доплату</button><button class="btn sm ghost" data-act="xcancel">Отмена</button></div>
  <p class="hint">В истории останется, кто добавил и когда. Спор «13 или 14» больше не возникнет.</p></div>`;
}
function sClient(c){
  const os=db.orders.filter(o=>o.clientId===c.id).sort((a,b)=>b.created-a.created);
  return`<div class="sh-top"><div><h2>${esc(c.name)}</h2><div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap"><span class="phone num">${fmtPhone(c.phone)}</span>${c.max?'<span class="tag max">MAX: подписан</span>':'<span class="tag">MAX: не подписан</span>'}</div></div><button class="x" data-act="close" aria-label="Закрыть">×</button></div>
  <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="stat"><div class="k">Заказов</div><div class="v num">${os.length}</div></div>
    <div class="stat"><div class="k">Всего</div><div class="v num">${rub(os.reduce((s,o)=>s+total(o),0))}</div></div>
    <div class="stat"><div class="k">Машины</div><div class="v" style="font-size:15px;font-family:var(--f-body);font-weight:600">${esc(c.cars.join(', ')||'—')}</div></div></div>
  <div class="card"><h3>Заметка</h3><textarea class="msg" id="cnote" rows="2" placeholder="Например: всегда торгуется, платит переводом">${esc(c.note)}</textarea><div class="actions"><button class="btn sm" data-act="savenote" data-v="${c.id}">Сохранить заметку</button><button class="btn sm primary" data-act="intakefor" data-v="${c.id}">Новая приёмка</button></div></div>
  <div class="sec"><h2>История заказов</h2><div class="list">${os.map(orderCard).join('')}</div></div>`;
}

/* ---------- дефекты ---------- */
function mTarget(){return modal.kind==='draft'?draft:order(modal.id)}
function renderModal(){
  const el=$('#modal');if(!modal){el.innerHTML='';return}
  if(modal.kind==='qr'){const o=order(modal.id);
    el.innerHTML=`<div class="modal" data-act="mclose-bg"><div class="mbox" role="dialog" aria-modal="true">
      <div class="mtop"><h3>№${o.num} · уведомления в MAX</h3><button class="x" data-act="mclose" aria-label="Закрыть">×</button></div>
      <div class="qr big">${qrSvg(maxLink(o))}</div>
      <p class="center" style="margin:0;font-weight:600;font-size:17px">Наведите камеру телефона на код<br>и нажмите «Начать»</p>
      <p class="hint center">Бот BI Color пришлёт акт приёмки с фото, а потом напишет, когда диски будут готовы.</p>
      <div class="actions" style="justify-content:center"><button class="btn" data-act="subscribe" data-v="${o.id}">Демо: клиент отсканировал</button><button class="btn primary" data-act="mclose">Клиент без MAX</button></div>
    </div></div>`;return}
  const t=mTarget();const w=modal.w;const list=t.defects.map((d,i)=>({...d,i})).filter(d=>d.w===w);
  el.innerHTML=`<div class="modal" data-act="mclose-bg"><div class="mbox" role="dialog" aria-modal="true">
    <div class="mtop"><h3>${wheelLabel(w,t.qty)} · ${t.radius}</h3><button class="x" data-act="mclose" aria-label="Закрыть">×</button></div>
    <p class="hint">${modal.pend?'Что здесь?':'Ткните в место дефекта на фото.'}</p>
    <div class="stage" id="stage">${t.photos&&t.photos[w]?`<img src="${t.photos[w]}" alt="">`:wheelSVG()}
      ${list.map((d,n)=>`<span class="mk" style="left:${d.x}%;top:${d.y}%">${n+1}</span>`).join('')}
      ${modal.pend?`<span class="mk pend" style="left:${modal.pend.x}%;top:${modal.pend.y}%">?</span>`:''}</div>
    ${modal.pend?`<div class="chips">${DEFECTS.map(x=>chip(x,'dtype',x,false)).join('')}<button class="chip" data-act="dcancel">Отмена</button></div>`:''}
    <div class="dlist">${list.map((d,n)=>`<div><span><b>${n+1}.</b> ${esc(d.type)}</span><button class="btn sm ghost" data-act="ddel" data-v="${d.i}">Убрать</button></div>`).join('')}</div>
    <div class="actions"><label class="btn"><input type="file" accept="image/*" capture="environment" data-ph="wheel" hidden>${t.photos&&t.photos[w]?'Переснять фото':'Сфотографировать диск'}</label>
    ${w<t.qty-1?`<button class="btn" data-act="dnext">Следующий диск →</button>`:''}<button class="btn primary" data-act="mclose">Готово</button></div>
  </div></div>`;
}
function readPhoto(file,cb){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file);
}

/* ---------- события ---------- */
let toastT;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3600)}
function copy(text){
  const done=()=>toast('Скопировано');
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const m=$('#msg');if(m){m.focus();m.select()}toast('Выделил текст — скопируйте вручную')}
}
function logTo(o,text){o.log.push({at:Date.now(),by:user,text})}
const A={
  go:(v)=>{view=v;sheet=null;render();$('#main').scrollTop=0},
  who:(v)=>{user=v;render()},
  order:(v)=>{sheet={type:'order',id:v};renderLayer()},
  client:(v)=>{sheet={type:'client',id:v};renderLayer()},
  close:()=>{sheet=null;render()},
  next:(v)=>{const o=order(v);o.status=nextSt(o.status);logTo(o,stName(o.status));const s=ST_MSG[o.status]&&notify(o,ST_MSG[o.status]);save();render();toast(`№${o.num} → ${stName(o.status)}`+(s?' · клиенту ушло в MAX':''))},
  status:(v)=>{const o=order(sheet.id);if(v==='done'){toast('Выдача — кнопкой «Получил и выдал»: так деньги точно запишутся');return}if(o.status===v)return;o.status=v;logTo(o,stName(v));const s=ST_MSG[v]&&notify(o,ST_MSG[v]);save();render();if(s)toast(`${stName(v)} · клиенту ушло сообщение в MAX`)},
  paym:(v)=>{sheet.pm=v;renderLayer()},
  issue:()=>{const o=order(sheet.id);const lf=left(o);const m=sheet.pm||'Наличные';if(lf>0)o.pays.push({amount:lf,method:m,at:Date.now(),by:user});o.status='done';logTo(o,`Выдан${lf?`, оплата ${rub(lf)} (${m.toLowerCase()})`:''}`);notify(o,'done');save();render();toast(`№${o.num} выдан, деньги записаны в «Получено сегодня»`)},
  addx:()=>{$('#addx').innerHTML=addxForm()},
  xsvc:(v)=>{sheet.xs=v;$('#addx').innerHTML=addxForm()},
  xcancel:()=>{sheet.xs=null;$('#addx').innerHTML=`<button class="btn sm" data-act="addx">+ Добавить работу (доплата)</button>`},
  xsave:()=>{const o=order(sheet.id);const name=$('#x-name').value.trim();const p=+$('#x-price').value.replace(/\D/g,'');if(!name||!p){toast('Укажите, что сделали, и сумму');return}
    const x={sid:sheet.xs||'other',name,unit:p,qty:1,by:user,at:Date.now(),extra:true};o.lines.push(x);logTo(o,`Доплата: ${name} — +${rub(p)}`);const s=notify(o,'extra',x);sheet.xs=null;save();render();toast(`Доплата добавлена. Новый итог: ${rub(total(o))}`+(s?' · клиент увидит в MAX':''))},
  notified:()=>{const o=order(sheet.id);o.notified=true;logTo(o,'Клиенту сообщили');save();renderLayer()},
  copymsg:()=>copy($('#msg').value),
  sendmax:()=>{const o=order(sheet.id);const t=$('#msg').value.trim();if(!t){toast('Напишите текст сообщения');return}
    o.msgs.push({at:Date.now(),text:t});o.notified=true;logTo(o,'MAX: '+t.split('\n')[0]);save();renderLayer();toast('Отправлено в MAX')},
  qr:(v)=>{modal={kind:'qr',id:v};renderModal()},
  subscribe:(v)=>{const o=order(v);const c=client(o.clientId);c.max=true;o.msgs=o.msgs||[];
    o.msgs.push({at:Date.now(),text:'Начать',me:true});o.msgs.push({at:Date.now(),text:botText('hello',o)});
    o.msgs.push({at:Date.now(),text:botText(o.status==='ready'?'ready':'new',o)});logTo(o,'Клиент подписался на уведомления в MAX');
    modal=null;renderModal();save();if(sheet)renderLayer();else render();toast(`${c.name.split(' ')[0]} подписан — бот прислал ${o.status==='ready'?'сообщение о готовности':'акт приёмки'}`)},
  copy:(v)=>copy(v),
  savenote:(v)=>{client(v).note=$('#cnote').value.trim();save();toast('Заметка сохранена')},
  intakefor:(v)=>{const c=client(v);draft=newDraft();draft.clientId=c.id;draft.phone=fmtPhone(c.phone);draft.name=c.name;draft.car=c.cars[0]||'';view='intake';sheet=null;render()},
  visit:(v)=>{const vs=db.visits[+v];draft=newDraft();const c=db.clients.find(x=>digits(x.phone)===digits(vs.phone));draft.phone=fmtPhone(vs.phone);if(c){draft.clientId=c.id;draft.name=c.name;draft.car=c.cars[0]||''}else draft.name='';draft.comment=vs.what;view='intake';render()},
  reset:()=>{db=seed();save();draft=newDraft();render();toast('Демо-данные сброшены')},
  // приёмка
  pick:(v)=>{touch();const c=client(v);draft.clientId=c.id;draft.phone=fmtPhone(c.phone);draft.name=c.name;if(!draft.car)draft.car=c.cars[0]||'';$('#in-phone').value=draft.phone;$('#in-name').value=draft.name;$('#in-car').value=draft.car;$('#in-phone').classList.remove('err');fillSugg();fillCars()},
  unpick:()=>{draft.clientId=null;fillSugg();fillCars()},
  repeat:(v)=>{const o=order(v);draft.car=o.car;draft.radius=o.radius;draft.qty=o.qty;draft.type=o.type||'Литые';draft.color=o.color&&COLORS.includes(o.color)?o.color:'';
    draft.lines=o.lines.filter(l=>!l.extra).map(l=>({...L(l.sid,o.radius,o.qty)}));intakeFill();toast('Заполнил как в прошлый раз — проверьте и поправьте')},
  car:(v)=>{touch();draft.car=v;$('#in-car').value=v;fillCars()},
  rad:(v)=>{touch();setRadius(v);fillDisks();fillSvc();fillTotal()},
  qty:(v)=>{touch();draft.qty=+v;draft.lines.forEach(l=>{if(svcById(l.sid)?.per==='disk')l.qty=draft.qty});fillDisks();fillSvc();fillWheels();fillTotal()},
  type:(v)=>{draft.type=v;fillDisks()},
  svc:(v)=>{touch();const i=draft.lines.findIndex(l=>l.sid===v);if(i>=0)draft.lines.splice(i,1);else{const s=svcById(v);draft.lines.push(L(v,draft.radius,s.per==='disk'?draft.qty:1))}fillSvc();fillTotal()},
  lq:(v,el)=>{const l=draft.lines[+v];l.qty=Math.max(1,Math.min(8,l.qty+ +el.dataset.d));fillSvc();fillTotal()},
  color:(v)=>{draft.color=draft.color===v?'':v;fillSvc()},
  kit:(v)=>{touch();const OPP={'С резиной':'Без резины','Без резины':'С резиной'};
    if(draft.kit.includes(v))draft.kit=draft.kit.filter(x=>x!==v);else draft.kit=[...draft.kit.filter(x=>x!==OPP[v]),v];fillKit()},
  due:(v)=>{draft.due=v;fillDue()},
  pm:(v)=>{draft.prepayMethod=v;fillDue()},
  accept:()=>acceptDraft(),
  // дефекты
  defects:(v,el)=>{if(el.dataset.k==='draft')touch();modal={kind:el.dataset.k,id:el.dataset.k==='order'?sheet.id:null,w:+v,pend:null};renderModal()},
  dtype:(v)=>{const t=mTarget();t.defects.push({w:modal.w,x:modal.pend.x,y:modal.pend.y,type:v});if(modal.kind==='order')logTo(t,`Отмечен дефект: ${v} (${wheelLabel(modal.w,t.qty)})`);modal.pend=null;save();renderModal()},
  dcancel:()=>{modal.pend=null;renderModal()},
  ddel:(v)=>{mTarget().defects.splice(+v,1);save();renderModal()},
  dnext:()=>{modal.w++;modal.pend=null;renderModal()},
  mclose:()=>{modal=null;renderModal();if(view==='intake'&&!sheet)fillWheels();else renderLayer()},
};
document.addEventListener('click',e=>{
  const stage=e.target.closest('#stage');
  if(stage&&modal){const r=stage.getBoundingClientRect();modal.pend={x:Math.round((e.clientX-r.left)/r.width*100),y:Math.round((e.clientY-r.top)/r.height*100)};renderModal();return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='mclose-bg'){if(e.target===el)A.mclose();return}
  if(A[act]){if(el.tagName==='BUTTON')e.preventDefault();A[act](el.dataset.v,el)}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='csearch'){$('#clist').innerHTML=clientRows(el.value);return}
  const k=el.dataset.in;if(!k)return;touch();
  if(k==='unit'){const l=draft.lines[+el.dataset.i];l.unit=+el.value.replace(/\D/g,'')||0;l.edited=true;el.closest('.ln').querySelector('.s').textContent=rub(l.unit*l.qty);fillTotal();return}
  if(k==='express'){draft.express=el.checked;fillTotal();return}
  draft[k]=el.value;
  if(k==='phone'){el.classList.remove('err');if(draft.clientId&&digits(client(draft.clientId).phone)!==digits(el.value))draft.clientId=null;
    const ex=digits(el.value).length===10&&db.clients.find(c=>digits(c.phone)===digits(el.value));if(ex&&!draft.clientId){A.pick(ex.id);return}fillSugg();fillCars()}
  if(k==='name'&&!draft.clientId)fillSugg();
});
document.addEventListener('change',e=>{
  const el=e.target;const kind=el.dataset.ph;if(!kind||!el.files||!el.files[0])return;
  readPhoto(el.files[0],src=>{
    if(kind==='wheel'){const t=mTarget();t.photos=t.photos||{};t.photos[modal.w]=src;if(modal.kind==='order')logTo(t,`Фото диска ${wheelLabel(modal.w,t.qty)}`);save();renderModal()}
    else{const o=order(sheet.id);o.stage.push({src,st:o.status,at:Date.now(),by:user});logTo(o,`Фото этапа «${stName(o.status)}»`);save();renderLayer()}
  });
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)A.mclose();else if(sheet)A.close()}});

load();draft=newDraft();render();
</script>
